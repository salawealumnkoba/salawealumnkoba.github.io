<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SALAWE ALUMNI - KOBA</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f1f5f9;color:#1e293b}
header{background:#0f172a;color:white;padding:30px 20px;text-align:center}
.container{max-width:500px;margin:auto;padding:15px}
.card{background:white;padding:22px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.06);margin:15px 0}
.btn{width:100%;background:#16a34a;color:white;padding:15px;border:none;border-radius:10px;font-weight:bold;font-size:17px;cursor:pointer;margin-top:10px}
.btn2{background:#0f172a}input{width:100%;padding:13px;margin:8px 0 14px;border:1px solid #cbd5e1;border-radius:9px}
.hidden{display:none}
.tabs{display:flex;gap:10px;margin-bottom:15px}.tab{flex:1;padding:12px;text-align:center;background:#e2e8f0;border-radius:9px;cursor:pointer;font-weight:bold}
.tab.active{background:#0f172a;color:white}
</style>
</head>
<body>
<header>
<h1>SALAWE ALUMNI - KOBA</h1>
<p>Karibu kwenye Mfumo wa Wanachama</p>
</header>

<div class="container">

<div class="tabs">
<div class="tab active" id="tab1" onclick="showTab('jisajili')">JISAJILI</div>
<div class="tab" id="tab2" onclick="showTab('ingia')">INGIA</div>
</div>

<!-- JISAJILI -->
<div class="card" id="box-jisajili">
<h2>📝 Jisajili</h2>
<label>Jina Kamili</label><input id="r_jina" placeholder="Emmanuel Mashaury Shinje">
<label>Namba ya Simu</label><input id="r_simu" placeholder="07XXXXXXXX">
<label>Weka Nywila Yako</label><input id="r_nywila" type="password" placeholder="****">
<label>Rudia Nywila</label><input id="r_nywila2" type="password" placeholder="****">
<button class="btn" onclick="jisajili()">JISAJILI</button>
</div>

<!-- INGIA -->
<div class="card hidden" id="box-ingia">
<h2>🔐 Ingia Kwenye Mfumo</h2>
<label>Jina / Simu</label><input id="l_jina" placeholder="Jina au Simu yako">
<label>Nywila</label><input id="l_nywila" type="password" placeholder="Nywila yako">
<button class="btn btn2" onclick="ingia()">INGIA</button>
</div>

<!-- DASHBOARD BAADA YA KUINGIA -->
<div class="card hidden" id="box-dash">
<h2>Karibu <span id="dash_jina"></span> 👋</h2>
<p>Umeingia kikamilifu kwenye mfumo wa KOBA.</p>
<div style="background:#fef9c3;border:2px dashed #eab308;padding:15px;border-radius:10px;text-align:center">
<b>M-PESA: 255 756 457 470</b><br>Emmanuel Mashaury Shinje
</div>
<label>Kiasi cha Mchango</label><input id="m_kiasi" placeholder="Mf: 20000">
<label>Namba ya Muamala</label><input id="m_muamala" placeholder="MP...">
<button class="btn" onclick="lipia()">LIPIA SASA</button>
<button class="btn btn2" onclick="toka()" style="background:#64748b">TOKA</button>
</div>

</div>

<script>
function showTab(t){
document.getElementById('box-jisajili').classList.add('hidden');
document.getElementById('box-ingia').classList.add('hidden');
document.getElementById('tab1').classList.remove('active');
document.getElementById('tab2').classList.remove('active');
if(t=='jisajili'){document.getElementById('box-jisajili').classList.remove('hidden');document.getElementById('tab1').classList.add('active')}
else{document.getElementById('box-ingia').classList.remove('hidden');document.getElementById('tab2').classList.add('active')}
}

function jisajili(){
let j=document.getElementById('r_jina').value.trim();
let s=document.getElementById('r_simu').value.trim();
let n=document.getElementById('r_nywila').value;
let n2=document.getElementById('r_nywila2').value;
if(!j || !s || !n){alert('Jaza taarifa zote');return}
if(n!=n2){alert('Nywila hazifanani');return}
let users=JSON.parse(localStorage.getItem('koba_users')||'[]');
if(users.find(u=>u.simu==s)){alert('Namba hii imeshasajiliwa, ingia');showTab('ingia');return}
users.push({jina:j,simu:s,nywila:n});
localStorage.setItem('koba_users',JSON.stringify(users));
alert('Umejisajili vizuri! Sasa ingia na nywila yako');
showTab('ingia');
}

function ingia(){
let j=document.getElementById('l_jina').value.trim();
let n=document.getElementById('l_nywila').value;
let users=JSON.parse(localStorage.getItem('koba_users')||'[]');
let u=users.find(x=>(x.jina.toLowerCase()==j.toLowerCase() || x.simu==j) && x.nywila==n);
if(!u){alert('Jina au Nywila si sahihi');return}
localStorage.setItem('koba_current',JSON.stringify(u));
onyeshaDash(u);
}

function onyeshaDash(u){
document.getElementById('box-jisajili').classList.add('hidden');
document.getElementById('box-ingia').classList.add('hidden');
document.querySelector('.tabs').classList.add('hidden');
document.getElementById('dash_jina').innerText=u.jina;
document.getElementById('box-dash').classList.remove('hidden');
}

function toka(){
localStorage.removeItem('koba_current');
location.reload();
}

function lipia(){
let k=document.getElementById('m_kiasi').value;
let mu=document.getElementById('m_muamala').value;
let u=JSON.parse(localStorage.getItem('koba_current'));
let msg=`*MCHANGO KOBA*%0AJina: ${u.jina}%0ASimu: ${u.simu}%0AKiasi: ${k}%0AMuamala: ${mu}`;
window.open(`https://wa.me/255756457470?text=${msg}`,'_blank');
}

// Auto login kama ameshasajili
let cur=localStorage.getItem('koba_current');
if(cur){onyeshaDash(JSON.parse(cur))}
</script>
</body>
</html>
